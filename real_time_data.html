<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Data - BloomAir</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .data-section, .chart-section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .data-section p, .chart-section p {
            text-align: left;
        }
        .chart-section canvas {
            max-width: 100%;
            height: auto;
        }
        .chart-section iframe {
            width: 100%;
            max-width: 450px;
            height: 260px;
            border: 1px solid #cccccc;
            margin: 10px auto;
            display: block;
        }
        .carousel {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
        }
        .carousel img {
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .last-updated {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .conditions-container {
            position: static;
            top: 100px;
            right: 20px;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 200px;
            text-align: left;
        }
        .conditions-container h2 {
            font-size: 1rem;
        }
        .conditions-container p {
            margin: 5px 0;
            font-size: 0.9rem;
        }
        .insect-explainer-bubble {
            position: static;
            top: 1500px;
            right: 20px;
            width: 240px;
            background-color: #fff9db;
            border-left: 5px solid #4bc469;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
        }
        .insect-explainer-bubble a {
            text-decoration: none;
            color: #054e31;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <site-header></site-header>
    <script src="components.js"></script>

    <div class="content">
        <h1>Real Time Data</h1>
        <p>Use AI on live data from our environmental sensors monitoring our ecosystem.</p>

        <!-- Zone for real-time value widgets -->
        <div class="chart-section">
            <h2>Live Sensor Readings</h2>
            <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/2916851/widgets/1057377"></iframe>
            <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/2916851/widgets/1057380"></iframe>
            <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/2916851/widgets/1057381"></iframe>
            <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/2916851/widgets/1057382"></iframe>
        </div>

        <!-- Zone for data visualization widgets (graphs) -->
        <div class="chart-section">
            <h2>Sensor Graphs</h2>
            <iframe src="https://thingspeak.com/channels/2916851/charts/1?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
            <iframe src="https://thingspeak.com/channels/2916851/charts/2?bgcolor=%23ffffff&color=%233c8dbc&dynamic=true&results=60&type=line&update=15"></iframe>
            <iframe src="https://thingspeak.com/channels/2916851/charts/3?bgcolor=%23ffffff&color=%2300a65a&dynamic=true&results=60&type=line&update=15"></iframe>
            <iframe src="https://thingspeak.com/channels/2916851/charts/4?bgcolor=%23ffffff&color=%23f39c12&dynamic=true&results=60&type=line&update=15"></iframe>
        </div>

        <div class="chart-section">
            <h2>Insect Activity Over Time</h2>
            <canvas id="insectChart" width="400" height="200"></canvas>
        </div>

        <div class="insect-explainer-bubble">
            🦋 Wonder how we counted the insects?<br>
            👉 <a href="how_we_count.html">Click here to learn how we used computer vision!</a>
        </div>

        <div class="data-section">
            <h2>Photos of Yesterday - <span id="yesterdayDate"></span></h2>
            <div id="yesterdayGallery" class="carousel"></div>

            <h2>Photos of Today - <span id="todayDate"></span></h2>
            <div id="todayGallery" class="carousel"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const insectCtx = document.getElementById('insectChart')?.getContext('2d');
            const insectChart = new Chart(insectCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Average Ant Count',
                            data: [],
                            borderColor: 'darkgreen',
                            fill: false
                        }
                    ]
                }
            });

            fetch('data/insect_history.json')
                .then(response => response.json())
                .then(history => {
                    history.forEach(entry => {
                        const ts = entry.timestamp;
                        const month = parseInt(ts.slice(0, 2), 10);
                        const day = parseInt(ts.slice(2, 4), 10);
                        const hour = parseInt(ts.slice(4, 6), 10);
                        const minute = ts.slice(6, 8);
                        const ampm = hour >= 12 ? 'PM' : 'AM';
                        const hour12 = hour % 12 === 0 ? 12 : hour % 12;
                        const label = `${new Date(2024, month - 1, day).toLocaleString('en-US', { month: 'short' })} ${day} ${hour12}:${minute} ${ampm}`;
                        insectChart.data.labels.push(label);
                        insectChart.data.datasets[0].data.push(entry.average);
                    });
                    insectChart.update();
                })
                .catch(err => console.error("Failed to load insect data:", err));

            function loadImages(folder, galleryId) {
                const gallery = document.getElementById(galleryId);
                gallery.innerHTML = "";
                const images = [
                    `${folder}/image1.jpg`,
                    `${folder}/image2.jpg`,
                    `${folder}/image3.jpg`
                ];
                images.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    gallery.appendChild(img);
                });
            }
            function formatDate(daysAgo) {
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);
                return date.toLocaleDateString();
            }
            document.getElementById('yesterdayDate').innerText = formatDate(1);
            document.getElementById('todayDate').innerText = formatDate(0);
            loadImages('assets/images/photos of yesterday', 'yesterdayGallery');
            loadImages('assets/images/photos of today', 'todayGallery');
        });
    </script>
</body>
</html>
