<!DOCTYPE html>

<head>

    <title>Join the Buzz - Trailer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content {
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

            color: #2a7b2a;

        video {
            width: 100%;
            height: auto;
            display: block;

        <h1>Bloom-AIR - Using AI for ecosystem restoration</h1>
        <div class="video-wrapper">
            <video controls>
                <source src="assets/videos/Bloom-AIR_pitch.mp4" type="video/mp4">

            </video>
        </div>
